[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # sqlx 0.8's umbrella package locks its optional MySQL driver. Tro enables only
  # Postgres; `cargo tree --target all -i rsa` proves this vulnerable crate is unreachable.
  "RUSTSEC-2023-0071",
]

[graph]
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = ["AGPL-3.0-only", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
