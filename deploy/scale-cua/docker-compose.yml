services:
  scale-cua:
    profiles: ["scale-cua"]
    image: vllm/vllm-openai@sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
    gpus: all
    ipc: host
    shm_size: "16gb"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HF_HOME: /models/cache
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${SCALE_CUA_API_KEY:?Set SCALE_CUA_API_KEY}
    volumes:
      - scale-cua-hf-cache:/models/cache
    command:
      - --model
      - extreme1228/ScaleCUA-qwen3.5-osworld
      - --revision
      - 2ad1314b6076591e35f299b2efed214e2454deab
      - --served-model-name
      - scalecua
      - --dtype
      - bfloat16
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.90"
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request;
          r=urllib.request.Request('http://127.0.0.1:8000/v1/models',headers={'Authorization':'Bearer '+os.environ['VLLM_API_KEY']});
          urllib.request.urlopen(r,timeout=5).read(1)"
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 10m
    restart: "no"

volumes:
  scale-cua-hf-cache:
