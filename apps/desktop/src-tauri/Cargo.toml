[package]
name = "desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
async-trait.workspace = true
blake3.workspace = true
contracts = { path = "../../../crates/contracts", version = "=0.1.0" }
cpal = "=0.18.1"
enigo = "=0.6.1"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-global-shortcut = "=2.3.2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true
xcap = "=0.9.8"
zeroize.workspace = true

[lints]
workspace = true
