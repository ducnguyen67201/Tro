[package]
name = "desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
contracts = { path = "../../../crates/contracts", version = "=0.1.0" }
cpal = "=0.18.1"
enigo = "=0.6.1"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "=2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-global-shortcut = "=2.3.2"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-util.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
url.workspace = true
uuid.workspace = true
webbrowser.workspace = true
xcap = "=0.9.8"
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
axuielement = { version = "=0.9.1", default-features = false }
core-foundation = "=0.10.1"
ghost-permissions = "=0.1.11"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Foundation", "Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
