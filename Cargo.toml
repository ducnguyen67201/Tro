[workspace]
resolver = "2"
members = [
  "crates/contracts",
  "crates/tutor-core",
  "services/api",
  "apps/desktop/src-tauri",
  "tools/eval-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
authors = ["Tro contributors"]

[workspace.dependencies]
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
async-trait = "=0.1.89"
axum = { version = "=0.8.9", features = ["json", "multipart", "macros"] }
base64 = "=0.22.1"
blake3 = "=1.8.2"
bytes = "=1.10.1"
hmac = "=0.12.1"
http = "=1.3.1"
http-body-util = "=0.1.3"
rand = "=0.9.5"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls"] }
schemars = { version = "=1.1.0", features = ["uuid1"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate"] }
subtle = "=2.6.1"
thiserror = "=2.0.17"
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "=0.7.16"
tower = { version = "=0.5.2", features = ["util", "limit"] }
tower-http = { version = "=0.6.11", features = ["request-id", "trace", "limit", "cors"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
unicode-normalization = "=0.1.24"
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
zeroize = { version = "=1.8.2", features = ["derive", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
